---
- name: Configure DNS server
  hosts: dns
  become: true

  tasks:

    - name: Install bind9
      apt:
        name:
          - bind9
          - dnsutils
        update_cache: true
        state: present

    - name: Configure named.conf.options
      copy:
        dest: /etc/bind/named.conf.options
        content: |
          options {
              directory "/var/cache/bind";

              forwarders {
                  {% for dns in external_dns %}
                  {{ dns }};
                  {% endfor %}
              };

              forward only;

              dnssec-validation no;
              listen-on { any; };

              allow-recursion { {{ infra_subnet }}; {{ client_subnet }}; };
          };

    - name: Configure named.conf.local
      copy:
        dest: /etc/bind/named.conf.local
        content: |
          zone "{{ dns_zone }}" {
              type master;
              file "/etc/bind/db.{{ dns_zone }}";
          };

    - name: Configure DNS zone
      copy:
        dest: /etc/bind/db.{{ dns_zone }}
        content: |
          $TTL 604800
          @ IN SOA dns1.{{ dns_zone }}. root.{{ dns_zone }}. (
              2
              604800
              86400
              2419200
              604800 )

          @ IN NS dns1.{{ dns_zone }}.

          {% for vm in vms | selectattr('ip', 'defined') | list %}
          {{ vm.name }} IN A {{ vm.ip }}
          {% endfor %}

    - name: Restart bind9
      systemd:
        name: bind9
        enabled: true
        state: restarted
