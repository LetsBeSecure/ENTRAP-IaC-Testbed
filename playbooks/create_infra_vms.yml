---
- name: Create infrastructure VMs (dns1, dhcp1, backup1)
  hosts: localhost
  become: true
  gather_facts: false

  vars:
    infra_vms: "{{ vms | selectattr('role', 'equalto', 'infra') | list }}"

  tasks:

    - name: Ensure VM storage directory exists
      file:
        path: "{{ vm_storage_dir }}"
        state: directory
        mode: '0755'

    - name: Create qcow2 disks
      command: >
        qemu-img create -f qcow2
        -F qcow2
        -b {{ base_image }}
        {{ vm_storage_dir }}/{{ item.name }}.qcow2 20G
      args:
        creates: "{{ vm_storage_dir }}/{{ item.name }}.qcow2"
      loop: "{{ infra_vms }}"

    - name: Create cloud-init folders
      file:
        path: "/tmp/{{ item.name }}"
        state: directory
      loop: "{{ infra_vms }}"

    - name: Create meta-data
      copy:
        dest: "/tmp/{{ item.name }}/meta-data"
        content: |
          instance-id: {{ item.name }}
          local-hostname: {{ item.name }}
      loop: "{{ infra_vms }}"

    - name: Create user-data
      copy:
        dest: "/tmp/{{ item.name }}/user-data"
        content: |
          #cloud-config

          hostname: {{ item.name }}

          users:
            - name: student
              groups: sudo
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              plain_text_passwd: student
              lock_passwd: false

          ssh_pwauth: true
          disable_root: false

          chpasswd:
            list: |
              student:student
            expire: false

          package_update: false
          package_upgrade: false

      loop: "{{ infra_vms }}"

    - name: Create network-config
      copy:
        dest: "/tmp/{{ item.name }}/network-config"
        content: |
          version: 2
          ethernets:
            {{ vm_interface }}:
              dhcp4: false
              addresses:
                - {{ item.ip }}/24
              routes:
                - to: default
                  via: {{ infra_gateway }}
                - to: {{ client_subnet }}
                  via: {{ (vms | selectattr('name', 'equalto', 'coreswitch') | first).ip }}
              nameservers:
                addresses: {{ ([item.dns_server] if item.dns_server is defined else external_dns) | to_json }}
      loop: "{{ infra_vms }}"

    - name: Generate cloud-init ISOs
      command: >
        genisoimage
        -output {{ vm_storage_dir }}/{{ item.name }}-seed.iso
        -volid cidata
        -joliet
        -rock
        /tmp/{{ item.name }}/user-data
        /tmp/{{ item.name }}/meta-data
        /tmp/{{ item.name }}/network-config
      loop: "{{ infra_vms }}"

    - name: Check if VM already exists
      shell: virsh dominfo {{ item.name }}
      register: vm_check
      failed_when: false
      changed_when: false
      loop: "{{ infra_vms }}"

    - name: Create VMs
      command: >
        virt-install
        --name {{ item.item.name }}
        --memory {{ item.item.memory }}
        --vcpus {{ item.item.vcpus }}
        --disk {{ vm_storage_dir }}/{{ item.item.name }}.qcow2
        --disk {{ vm_storage_dir }}/{{ item.item.name }}-seed.iso,device=cdrom
        --network network={{ infra_network_name }}
        --os-variant ubuntu22.04
        --graphics none
        --import
        --noautoconsole
      when: item.rc != 0
      loop: "{{ vm_check.results }}"

    - name: Enable VM autostart on host reboot
      command: virsh autostart {{ item.name }}
      loop: "{{ infra_vms }}"

- name: Wait for infra VMs SSH
  hosts: infra_vms
  gather_facts: false
  tasks:
    - name: Wait for SSH (via ProxyJump)
      wait_for_connection:
        timeout: 600
        delay: 10
