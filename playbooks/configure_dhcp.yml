---
- name: Configure DHCP server
  hosts: dhcp
  become: true

  tasks:

    - name: Install Kea DHCP
      apt:
        name:
          - kea
          - kea-dhcp4-server
        update_cache: true
        state: present

    - name: Configure Kea DHCP
      copy:
        dest: /etc/kea/kea-dhcp4.conf
        content: |
          {
            "Dhcp4": {
              "interfaces-config": {
                "interfaces": [ "{{ dhcp_interface }}" ]
              },

              "lease-database": {
                  "type": "memfile",
                  "persist": true,
                  "name": "/var/lib/kea/kea-leases4.csv",
                  "lfc-interval": 1800,
                  "max-row-errors": 100
              },

              "subnet4": [
                {
                  "subnet": "{{ infra_subnet }}",
                  "pools": [
                    {
                      "pool": "{{ dhcp_pool_start }} - {{ dhcp_pool_end }}"
                    }
                  ],

                  "option-data": [
                    {
                      "name": "routers",
                      "data": "{{ infra_gateway }}"
                    },
                    {
                      "name": "domain-name-servers",
                      "data": "{{ (vms | selectattr('name', 'equalto', 'dns1') | first).ip }}"
                    }
                  ]
                },
                {
                  "subnet": "{{ client_subnet }}",
                  "pools": [
                    {
                      "pool": "{{ client_dhcp_pool_start }} - {{ client_dhcp_pool_end }}"
                    }
                  ],

                  "option-data": [
                    {
                      "name": "routers",
                      "data": "{{ client_gateway }}"
                    },
                    {
                      "name": "domain-name-servers",
                      "data": "{{ (vms | selectattr('name', 'equalto', 'dns1') | first).ip }}"
                    }
                  ]
                }
              ],
                                
              "loggers": [
                {
                  "name": "kea-dhcp4",
                  "output_options": [
                    {
                      "output": "/var/log/kea/kea-dhcp4.log"
                    }
                  ],
                  "severity": "INFO"
                }
              ]
            }
          }

    - name: Restart DHCP
      systemd:
        name: kea-dhcp4-server
        enabled: true
        state: restarted
