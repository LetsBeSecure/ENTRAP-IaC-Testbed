---
- name: Configure DHCP server
  hosts: dhcp
  become: true

  tasks:

    - name: Install Kea DHCP
      apt:
        name:
          - kea
          - kea-dhcp4-server
        update_cache: true
        state: present

    - name: Configure Kea DHCP
      copy:
        dest: /etc/kea/kea-dhcp4.conf
        content: |
          {
            "Dhcp4": {
              "interfaces-config": {
                "interfaces": [ "{{ dhcp_interface }}" ]
              },

              "subnet4": [
                {
                  "subnet": "{{ enterprise_subnet }}",
                  "pools": [
                    {
                      "pool": "{{ dhcp_pool_start }} - {{ dhcp_pool_end }}"
                    }
                  ],

                  "option-data": [
                    {
                      "name": "routers",
                      "data": "{{ enterprise_gateway }}"
                    },
                    {
                      "name": "domain-name-servers",
                      "data": "{{ (vms | selectattr('name', 'equalto', 'dns1') | first).ip }}"
                    }
                  ]
                }
              ]
            }
          }

    - name: Restart DHCP
      systemd:
        name: kea-dhcp4-server
        enabled: true
        state: restarted
