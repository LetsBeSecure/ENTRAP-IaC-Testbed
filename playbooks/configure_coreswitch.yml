---
- name: Configure coreswitch routing and DHCP relay
  hosts: coreswitch
  become: true

  tasks:

    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    - name: Install iptables-persistent and isc-dhcp-relay
      apt:
        name:
          - iptables-persistent
          - isc-dhcp-relay
        update_cache: true
        state: present

    # No NAT here - gateway1 (enp2s0/WAN side, virbr1) is the sole NAT
    # point. coreswitch just routes/forwards between infra (enp1s0),
    # client (enp2s0) and the uplink to gateway1 (enp3s0/link-net).

    - name: Allow FORWARD client -> infra
      iptables:
        chain: FORWARD
        in_interface: enp2s0
        out_interface: enp1s0
        jump: ACCEPT

    - name: Allow FORWARD infra -> client
      iptables:
        chain: FORWARD
        in_interface: enp1s0
        out_interface: enp2s0
        jump: ACCEPT

    - name: Allow FORWARD infra -> uplink (gateway1)
      iptables:
        chain: FORWARD
        in_interface: enp1s0
        out_interface: enp3s0
        jump: ACCEPT

    - name: Allow FORWARD uplink (gateway1) -> infra
      iptables:
        chain: FORWARD
        in_interface: enp3s0
        out_interface: enp1s0
        jump: ACCEPT

    - name: Allow FORWARD client -> uplink (gateway1)
      iptables:
        chain: FORWARD
        in_interface: enp2s0
        out_interface: enp3s0
        jump: ACCEPT

    - name: Allow FORWARD uplink (gateway1) -> client
      iptables:
        chain: FORWARD
        in_interface: enp3s0
        out_interface: enp2s0
        jump: ACCEPT

    - name: Save iptables rules
      command: netfilter-persistent save

    - name: Configure DHCP relay
      copy:
        dest: /etc/default/isc-dhcp-relay
        content: |
          SERVERS="{{ (vms | selectattr('name', 'equalto', 'dhcp1') | first).ip }}"
          INTERFACES="enp1s0 enp2s0"
          OPTIONS=""

    - name: Restart DHCP relay
      systemd:
        name: isc-dhcp-relay
        enabled: true
        state: restarted
