---
- name: Check testbed readiness
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Check 1: Gateway reachable"
      shell: >
        ssh -i {{ infra_ssh_private_key_path }}
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o ConnectTimeout=10
        admin@{{ (vms | selectattr('name','equalto','gateway1') | first).wan_ip }} "hostname"
      register: gw_check
      ignore_errors: true

    - name: Gateway result
      debug:
        msg: "{{ '✓ Gateway reachable: ' ~ gw_check.stdout if gw_check.rc == 0 else '✗ Gateway UNREACHABLE' }}"

    - name: "Check 2: Detect client leases"
      shell: >
        ssh -i {{ infra_ssh_private_key_path }}
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o ProxyJump=admin@{{ (vms | selectattr('name','equalto','gateway1') | first).wan_ip }}
        admin@10.10.10.2
        "awk -F',' 'NR>1 && \$10==\"0\" {print \$1}' /var/lib/kea/kea-leases4.csv"
      register: lease_check
      ignore_errors: true

    - name: Set client IPs
      set_fact:
        active_clients: "{{ lease_check.stdout_lines | default([]) }}"

    - name: Lease result
      debug:
        msg: "{{ '✓ ' ~ (active_clients | length) ~ ' clients: ' ~ (active_clients | join(', ')) if active_clients | length > 0 else '✗ No active leases' }}"

    - name: Add first client for checks
      add_host:
        name: "{{ active_clients[0] }}"
        groups: check_targets
        ansible_user: "{{ client_user }}"
        ansible_password: "{{ client_password }}"
        ansible_ssh_common_args: >-
          -o ProxyCommand="ssh -i {{ infra_ssh_private_key_path }}
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          -W %h:%p admin@{{ (vms | selectattr('name','equalto','gateway1') | first).wan_ip }}"
      when: active_clients | length > 0

    - name: Fail if gateway or clients down
      fail:
        msg: "Testbed not ready — gateway unreachable or no clients"
      when: gw_check.rc != 0 or active_clients | length == 0

- name: Check client cleanliness
  hosts: check_targets
  gather_facts: false
  tasks:
    - name: "Check 3: SSH to client"
      shell: hostname
      register: client_hostname
      ignore_errors: true

    - name: Client SSH result
      debug:
        msg: "✓ Client reachable: {{ client_hostname.stdout | default('unknown') }}"

    - name: "Check 4: Scan for attack artifacts"
      shell: |
        test -f ~/RANSOM_NOTE.txt && echo 'DIRTY:ransom_note' || true
        test -f /tmp/gonnacry && echo 'DIRTY:gonnacry_binary' || true
        test -f /tmp/nmap_results.txt && echo 'DIRTY:nmap_results' || true
        ls ~/Documents/*.GNNCRY 2>/dev/null | head -1 | xargs -I{} echo 'DIRTY:encrypted_files' || true
        echo 'DONE'
      register: artifacts

    - name: Cleanliness result
      debug:
        msg: "{{ '✓ Testbed CLEAN' if (artifacts.stdout_lines | select('match','^DIRTY:') | list | length == 0) else '⚠ DIRTY: ' ~ (artifacts.stdout_lines | select('match','^DIRTY:') | list | join(', ')) }}"

- name: Final report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Report
      debug:
        msg: |
          ════════════════════════════════════════════════
          TESTBED READY — Students can launch attacks.
          Active clients: {{ active_clients | join(', ') }}
          ════════════════════════════════════════════════
