---
- name: Create VM snapshots
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Deleting existing snapshot if present
      command: virsh snapshot-delete {{ item }} {{ snapshot_name }}
      loop: "{{ vms | map(attribute='name') | list }}"
      ignore_errors: true

    - name: Create fresh snapshots
      command: virsh snapshot-create-as {{ item }} {{ snapshot_name }} --live
      loop: "{{ vms | map(attribute='name') | list }}"

