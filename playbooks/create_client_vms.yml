---
- name: Create client VMs
  hosts: localhost
  become: true
  gather_facts: false

  vars:
    client_vms: "{{ range(1, client_count + 1) | list }}"
    backup_pubkey: "{{ hostvars['localhost']['backup_pubkey'] | default('') }}"

  tasks:

    - name: Ensure VM storage directory exists
      file:
        path: "{{ vm_storage_dir }}"
        state: directory
        mode: '0755'

    - name: Create qcow2 disks
      command: >
        qemu-img create -f qcow2
        -F qcow2
        -b {{ base_image }}
        {{ vm_storage_dir }}/client{{ item }}.qcow2 20G
      args:
        creates: "{{ vm_storage_dir }}/client{{ item }}.qcow2"
      loop: "{{ client_vms }}"

    - name: Create cloud-init folders
      file:
        path: "/tmp/client{{ item }}"
        state: directory
      loop: "{{ client_vms }}"

    - name: Create meta-data
      copy:
        dest: "/tmp/client{{ item }}/meta-data"
        content: |
          instance-id: client{{ item }}
          local-hostname: client{{ item }}
      loop: "{{ client_vms }}"

    - name: Create user-data
      copy:
        dest: "/tmp/client{{ item }}/user-data"
        content: |
          #cloud-config

          hostname: client{{ item }}

          users:
            - name: student
              groups: sudo
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              plain_text_passwd: student
              lock_passwd: false
          {% if backup_pubkey %}
              ssh_authorized_keys:
                - {{ backup_pubkey }}
          {% endif %}

          ssh_pwauth: true
          disable_root: false

          chpasswd:
            list: |
              student:student
            expire: false

          package_update: false
          package_upgrade: false

      loop: "{{ client_vms }}"

    - name: Create network-config
      copy:
        dest: "/tmp/client{{ item }}/network-config"
        content: |
          version: 2
          ethernets:
            {{ vm_interface }}:
              dhcp4: true
      loop: "{{ client_vms }}"

    - name: Generate cloud-init ISOs
      command: >
        genisoimage
        -output {{ vm_storage_dir }}/client{{ item }}-seed.iso
        -volid cidata
        -joliet
        -rock
        /tmp/client{{ item }}/user-data
        /tmp/client{{ item }}/meta-data
        /tmp/client{{ item }}/network-config
      loop: "{{ client_vms }}"

    - name: Check if VM already exists
      shell: virsh dominfo client{{ item }}
      register: vm_check
      failed_when: false
      changed_when: false
      loop: "{{ client_vms }}"

    - name: Create VMs
      command: >
        virt-install
        --name client{{ item.item }}
        --memory {{ client_memory }}
        --vcpus {{ client_vcpus }}
        --disk {{ vm_storage_dir }}/client{{ item.item }}.qcow2
        --disk {{ vm_storage_dir }}/client{{ item.item }}-seed.iso,device=cdrom
        --network network={{ client_network_name }}
        --os-variant ubuntu22.04
        --graphics none
        --import
        --noautoconsole
      when: item.rc != 0
      loop: "{{ vm_check.results }}"
