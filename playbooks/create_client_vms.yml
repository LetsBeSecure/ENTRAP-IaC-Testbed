---
- name: Create client VMs
  hosts: localhost
  become: true
  gather_facts: false

  vars:
    client_vms: "{{ vms | selectattr('role', 'equalto', 'client') | list }}"

  tasks:

    - name: Ensure VM storage directory exists
      file:
        path: "{{ vm_storage_dir }}"
        state: directory
        mode: '0755'

    - name: Create qcow2 disks
      command: >
        qemu-img create -f qcow2
        -F qcow2
        -b {{ base_image }}
        {{ vm_storage_dir }}/{{ item.name }}.qcow2 20G
      args:
        creates: "{{ vm_storage_dir }}/{{ item.name }}.qcow2"
      loop: "{{ client_vms }}"

    - name: Create cloud-init folders
      file:
        path: "/tmp/{{ item.name }}"
        state: directory
      loop: "{{ client_vms }}"

    - name: Create meta-data
      copy:
        dest: "/tmp/{{ item.name }}/meta-data"
        content: |
          instance-id: {{ item.name }}
          local-hostname: {{ item.name }}
      loop: "{{ client_vms }}"

    - name: Create user-data
      copy:
        dest: "/tmp/{{ item.name }}/user-data"
        content: |
          #cloud-config

          hostname: {{ item.name }}

          users:
            - name: student
              groups: sudo
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              plain_text_passwd: student
              lock_passwd: false

          ssh_pwauth: true
          disable_root: false

          chpasswd:
            list: |
              student:student
            expire: false

          package_update: false
          package_upgrade: false

      loop: "{{ client_vms }}"

    - name: Create network-config
      copy:
        dest: "/tmp/{{ item.name }}/network-config"
        content: |
          version: 2
          ethernets:
            {{ vm_interface }}:
              dhcp4: true
      loop: "{{ client_vms }}"

    - name: Generate cloud-init ISOs
      command: >
        genisoimage
        -output {{ vm_storage_dir }}/{{ item.name }}-seed.iso
        -volid cidata
        -joliet
        -rock
        /tmp/{{ item.name }}/user-data
        /tmp/{{ item.name }}/meta-data
        /tmp/{{ item.name }}/network-config
      loop: "{{ client_vms }}"

    - name: Check if VM already exists
      shell: virsh dominfo {{ item.name }}
      register: vm_check
      failed_when: false
      changed_when: false
      loop: "{{ client_vms }}"

    - name: Create VMs
      command: >
        virt-install
        --name {{ item.item.name }}
        --memory {{ item.item.memory }}
        --vcpus {{ item.item.vcpus }}
        --disk {{ vm_storage_dir }}/{{ item.item.name }}.qcow2
        --disk {{ vm_storage_dir }}/{{ item.item.name }}-seed.iso,device=cdrom
        --network network={{ enterprise_network_name }}
        --os-variant ubuntu22.04
        --graphics none
        --import
        --noautoconsole
      when: item.rc != 0
      loop: "{{ vm_check.results }}"
