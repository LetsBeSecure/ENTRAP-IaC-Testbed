---
- name: Destroy client VMs only
  hosts: localhost
  connection: local
  become: true
  become_method: sudo
  gather_facts: false

  vars:
    client_vms: "{{ range(1, client_count + 1) | list }}"

  tasks:

    - name: Destroy client VMs
      shell: virsh destroy client{{ item }}
      loop: "{{ client_vms }}"
      ignore_errors: true

    - name: Undefine client VMs
      shell: virsh undefine client{{ item }} --snapshots-metadata
      loop: "{{ client_vms }}"
      ignore_errors: true

    - name: Remove client disk and seed ISO files
      shell: "rm -f {{ vm_storage_dir }}/client{{ item }}.qcow2 {{ vm_storage_dir }}/client{{ item }}-seed.iso"
      loop: "{{ client_vms }}"
      ignore_errors: true
