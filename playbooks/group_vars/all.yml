# WAN/uplink network for the gateway VM (NAT #2 leg, host -> eno2)
# See playbooks/00_create_networks.yml for why this exists.
wan_network_name: wan-net
wan_bridge_name: virbr1
wan_subnet: 173.168.0.0/24
wan_host_ip: 173.168.0.1
network_xml_wan: "{{ network_xml_dir }}/wan-net.xml"

# Link network: gateway1 <-> coreswitch. Isolated (no host IP/forward) -
# gateway1 owns 10.10.0.1, does its own NAT via nft.
link_network_name: link-net
link_bridge_name: virbr2
link_subnet: 10.10.0.0/24
link_gateway: 10.10.0.1
network_xml_link: "{{ network_xml_dir }}/link-net.xml"

# Infra network (isolated bridge — coreswitch routes/relays for this subnet)
infra_network_name: infra-net
infra_bridge_name: virbr3
infra_gateway: 10.10.10.1
infra_subnet: 10.10.10.0/24
infra_netmask: 255.255.255.0

# Client network (isolated bridge — coreswitch routes/relays for this subnet)
client_network_name: client-net
client_bridge_name: virbr4
client_subnet: 10.10.20.0/24
client_gateway: 10.10.20.1
client_netmask: 255.255.255.0

project_root: "{{ playbook_dir }}/.."
vm_storage_dir: "/var/lib/libvirt/images/ransomware_lab"
base_image: "{{ vm_storage_dir }}/jammy-server-cloudimg-amd64.img"
cloud_init_dir: "{{ project_root }}/cloud_init"

network_xml: "{{ project_root }}/configs/network/infra-net.xml"
network_xml_dir: "{{ project_root }}/configs/network"

dns_zone: "enterprise.lab"
dhcp_pool_start: "10.10.10.150"
dhcp_pool_end: "10.10.10.200"
client_dhcp_pool_start: "10.10.20.150"
client_dhcp_pool_end: "10.10.20.200"
dhcp_interface: "enp1s0"
vm_interface: "enp1s0"
backup_share_path: "/srv/backups"
snapshot_name: "clean-state"

client_count: 2 
client_memory: 2048
client_vcpus: 2

external_dns:
  - "192.168.36.53"
  - "8.8.8.8"
  - "1.1.1.1"

vms:
  - name: dns1
    role: infra
    ip: 10.10.10.53
    memory: 2048
    vcpus: 2

  - name: dhcp1
    role: infra
    ip: 10.10.10.2
    dns_server: 10.10.10.53
    memory: 2048
    vcpus: 2

  - name: backup1
    role: infra
    ip: 10.10.10.20
    dns_server: 10.10.10.53
    memory: 2048
    vcpus: 2

  - name: coreswitch
    role: router
    ip: 10.10.10.1
    ip_client: 10.10.20.1
    ip_link: 10.10.0.2
    dns_server: 10.10.10.53
    memory: 1024
    vcpus: 1

  - name: gateway1
    role: gateway
    ip: 10.10.0.1
    wan_ip: 173.168.0.10
    # uses external_dns (IITH/public resolvers) for now - dns1 sits
    # behind this gateway, not yet wired as resolver. Switch to dns1
    # later once the gateway cutover is done.
    memory: 1024
    vcpus: 1
