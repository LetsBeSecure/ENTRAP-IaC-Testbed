---
- name: Create libvirt networks
  hosts: localhost
  become: true
  gather_facts: false

  vars:
    networks:
      - name: "{{ enterprise_network_name }}"
        xml: "{{ network_xml }}"
      - name: "{{ client_network_name }}"
        xml: "{{ network_xml_dir }}/client-net.xml"

  tasks:

    - name: Check if network exists
      shell: virsh net-list --all | grep -w {{ item.name }}
      register: network_checks
      failed_when: false
      changed_when: false
      loop: "{{ networks }}"

    - name: Define networks
      command: virsh net-define {{ item.item.xml }}
      when: item.rc != 0
      loop: "{{ network_checks.results }}"

    - name: Start networks
      command: virsh net-start {{ item.item.name }}
      when: item.rc != 0
      loop: "{{ network_checks.results }}"

    - name: Enable autostart
      command: virsh net-autostart {{ item.item.name }}
      when: item.rc != 0
      loop: "{{ network_checks.results }}"
