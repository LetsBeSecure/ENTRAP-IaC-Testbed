---
- name: Create coreswitch VM
  hosts: localhost
  become: true
  gather_facts: false

  vars:
    cs: "{{ vms | selectattr('role', 'equalto', 'router') | first }}"

  tasks:

    - name: Ensure VM storage directory exists
      file:
        path: "{{ vm_storage_dir }}"
        state: directory
        mode: '0755'

    - name: Create qcow2 disk
      command: >
        qemu-img create -f qcow2
        -F qcow2
        -b {{ base_image }}
        {{ vm_storage_dir }}/{{ cs.name }}.qcow2 20G
      args:
        creates: "{{ vm_storage_dir }}/{{ cs.name }}.qcow2"

    - name: Create cloud-init folder
      file:
        path: "/tmp/{{ cs.name }}"
        state: directory

    - name: Create meta-data
      copy:
        dest: "/tmp/{{ cs.name }}/meta-data"
        content: |
          instance-id: {{ cs.name }}
          local-hostname: {{ cs.name }}

    - name: Create user-data
      copy:
        dest: "/tmp/{{ cs.name }}/user-data"
        content: |
          #cloud-config

          hostname: {{ cs.name }}

          users:
            - name: student
              groups: sudo
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              plain_text_passwd: student
              lock_passwd: false

          ssh_pwauth: true
          disable_root: false

          chpasswd:
            list: |
              student:student
            expire: false

          package_update: false
          package_upgrade: false

    - name: Create network-config
      copy:
        dest: "/tmp/{{ cs.name }}/network-config"
        content: |
          version: 2
          ethernets:
            enp1s0:
              dhcp4: false
              addresses:
                - {{ cs.ip }}/24
              # uses external_dns for now - dns1 not deployed/reachable yet
              # at VM-creation time. Switch to cs.dns_server (dns1) later
              # once infra VMs are confirmed up.
              nameservers:
                addresses: {{ external_dns | to_json }}
            enp2s0:
              dhcp4: false
              addresses:
                - {{ cs.ip_client }}/24
            enp3s0:
              dhcp4: false
              addresses:
                - {{ cs.ip_link }}/24
              routes:
                - to: default
                  via: {{ link_gateway }}

    - name: Generate cloud-init ISO
      command: >
        genisoimage
        -output {{ vm_storage_dir }}/{{ cs.name }}-seed.iso
        -volid cidata
        -joliet
        -rock
        /tmp/{{ cs.name }}/user-data
        /tmp/{{ cs.name }}/meta-data
        /tmp/{{ cs.name }}/network-config

    - name: Check if VM already exists
      shell: virsh dominfo {{ cs.name }}
      register: vm_check
      failed_when: false
      changed_when: false

    - name: Create coreswitch VM (3 NICs)
      command: >
        virt-install
        --name {{ cs.name }}
        --memory {{ cs.memory }}
        --vcpus {{ cs.vcpus }}
        --disk {{ vm_storage_dir }}/{{ cs.name }}.qcow2
        --disk {{ vm_storage_dir }}/{{ cs.name }}-seed.iso,device=cdrom
        --network network={{ infra_network_name }}
        --network network={{ client_network_name }}
        --network network={{ link_network_name }}
        --os-variant ubuntu22.04
        --graphics none
        --import
        --noautoconsole
      when: vm_check.rc != 0

    - name: Enable VM autostart
      command: virsh autostart {{ cs.name }}

- name: Wait for coreswitch SSH
  hosts: coreswitch
  gather_facts: false
  tasks:
    - name: Wait for SSH (via ProxyJump)
      wait_for_connection:
        timeout: 600
        delay: 10
