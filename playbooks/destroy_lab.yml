---
- name: Destroy ransomware lab
  hosts: localhost
  connection: local
  become: true
  become_method: sudo
  gather_facts: false

  tasks:

    - name: Destroy VMs
      shell: virsh destroy {{ item }}
      loop: "{{ vms | map(attribute='name') | list }}"
      ignore_errors: true

    - name: Undefine VMs
      shell: virsh undefine {{ item }} --snapshots-metadata
      loop: "{{ vms | map(attribute='name') | list }}"
      ignore_errors: true

    - name: Remove VM disk and seed ISO files
      shell: "rm -f {{ vm_storage_dir }}/{{ item }}.qcow2 {{ vm_storage_dir }}/{{ item }}-seed.iso"
      loop: "{{ vms | map(attribute='name') | list }}"
      ignore_errors: true

    - name: Destroy network
      shell: virsh net-destroy {{ enterprise_network_name }}
      ignore_errors: true

    - name: Undefine network
      shell: virsh net-undefine {{ enterprise_network_name }}
      ignore_errors: true
