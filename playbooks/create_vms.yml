---
- name: Create enterprise VMs
  hosts: localhost
  become: true
  gather_facts: false

  tasks:

    - name: Ensure VM storage directory exists
      file:
        path: "{{ vm_storage_dir }}"
        state: directory
        mode: '0755'

    - name: Create qcow2 disks
      command: >
        qemu-img create -f qcow2
        -F qcow2
        -b {{ base_image }}
        {{ vm_storage_dir }}/{{ item.name }}.qcow2 20G
      args:
        creates: "{{ vm_storage_dir }}/{{ item.name }}.qcow2"
      loop: "{{ vms }}"

    - name: Create cloud-init folders
      file:
        path: "/tmp/{{ item.name }}"
        state: directory
      loop: "{{ vms }}"

    - name: Create meta-data
      copy:
        dest: "/tmp/{{ item.name }}/meta-data"
        content: |
          instance-id: {{ item.name }}
          local-hostname: {{ item.name }}
      loop: "{{ vms }}"

    - name: Create user-data
      copy:
        dest: "/tmp/{{ item.name }}/user-data"
        content: |
          #cloud-config

          hostname: {{ item.name }}

          users:
            - name: student
              groups: sudo
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              plain_text_passwd: student
              lock_passwd: false

          ssh_pwauth: true
          disable_root: false

          chpasswd:
            list: |
              student:student
            expire: false

          package_update: false
          package_upgrade: false

          write_files:
            - path: /etc/netplan/01-netcfg.yaml
              permissions: '0600'
              content: |
                network:
                  version: 2
                  ethernets:
                    {{ vm_interface }}:
                      dhcp4: false
                      addresses:
                        - {{ item.ip }}/24
                      routes:
                        - to: default
                          via: {{ enterprise_gateway }}
                      nameservers:
                        addresses: {{ external_dns | to_json }}

          runcmd:
            - netplan apply

      loop: "{{ vms }}"

    - name: Generate cloud-init ISOs
      command: >
        genisoimage
        -output {{ vm_storage_dir }}/{{ item.name }}-seed.iso
        -volid cidata
        -joliet
        -rock
        /tmp/{{ item.name }}/user-data
        /tmp/{{ item.name }}/meta-data
      loop: "{{ vms }}"

    - name: Check if VM already exists
      shell: virsh dominfo {{ item.name }}
      register: vm_check
      failed_when: false
      changed_when: false
      loop: "{{ vms }}"

    - name: Create VMs
      command: >
        virt-install
        --name {{ item.item.name }}
        --memory {{ item.item.memory }}
        --vcpus {{ item.item.vcpus }}
        --disk {{ vm_storage_dir }}/{{ item.item.name }}.qcow2
        --disk {{ vm_storage_dir }}/{{ item.item.name }}-seed.iso,device=cdrom
        --network network={{ enterprise_network_name }}
        --os-variant ubuntu22.04
        --graphics none
        --import
        --noautoconsole
      when: item.rc != 0
      loop: "{{ vm_check.results }}"

    - name: Wait 120 seconds for cloud-init
      pause:
        seconds: 120

    - name: Wait for SSH
      wait_for:
        host: "{{ item.ip }}"
        port: 22
        timeout: 600
        delay: 10
      loop: "{{ vms }}"
