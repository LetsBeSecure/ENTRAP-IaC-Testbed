# Suricata log rotation — deployed to /etc/logrotate.d/suricata
#
# Split EVE logs rotate daily, 30 days retention (forensic window for incident response).
# suricata.log (daemon log) rotates daily, 7 days retention.
# Suricata reopens log files on SIGHUP — postrotate sends HUP via systemd.
#
# size 500M hard cap per log: if a single file grows past 500MB before midnight
# (e.g. during an active attack generating alert floods), logrotate forces an
# early rotation on the next hourly run rather than letting the disk fill.

/var/log/suricata/eve-alert.json
/var/log/suricata/eve-dns.json
/var/log/suricata/eve-http.json
/var/log/suricata/eve-tls.json
/var/log/suricata/eve-anomaly.json
/var/log/suricata/fast.log
{
    daily
    rotate 30
    size 500M
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        systemctl kill -s HUP suricata 2>/dev/null || true
    endscript
}

/var/log/suricata/suricata.log
{
    daily
    rotate 7
    size 100M
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        systemctl kill -s HUP suricata 2>/dev/null || true
    endscript
}
