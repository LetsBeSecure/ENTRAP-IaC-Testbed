[gateway]
10.10.0.1 ansible_host=173.168.0.10

[coreswitch]
10.10.10.1 # can be any other interface of coreswitch

[dhcp]
10.10.10.2

[dns]
10.10.10.53

[backup]
10.10.10.20

[web]
10.10.10.10

[clients]
# clients get dynamic IPs from DHCP - add manually after deployment

# infra-net (10.10.10.0/24) hosts - host has no route there directly.
# reach via gateway1 (173.168.0.10) as SSH jump host - gateway1 has the
# routes to infra/client subnets (configure_gateway.yml).
[infra_net:children]
coreswitch
dhcp
dns
backup
web

[infra_vms:children]
dhcp
dns
backup
web

[infra_net:vars]
ansible_ssh_common_args='-o ProxyCommand="sshpass -p student ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p student@173.168.0.10"'

[all:vars]
ansible_user=student
ansible_password=student
