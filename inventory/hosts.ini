[gateway]
10.10.0.1 ansible_host=173.168.0.10

# C2 server on wan-net — simulates attacker-controlled "internet" server.
# Directly reachable from host (no ProxyJump), same as gateway1.
[c2]
173.168.0.50

[c2:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[coreswitch]
10.10.10.1 # can be any other interface of coreswitch

[dhcp]
10.10.10.2

[dns]
10.10.10.53

[backup]
10.10.10.20

[web]
10.10.10.10

[clients]
# clients get dynamic IPs from DHCP - add manually after deployment

# infra-net (10.10.10.0/24) hosts - host has no route there directly.
# reach via gateway1 (173.168.0.10) as SSH jump host - gateway1 has the
# routes to infra/client subnets (configure_gateway.yml).
[infra_net:children]
coreswitch
dhcp
dns
backup
web

[infra_vms:children]
dhcp
dns
backup
web

# Infra VMs and network devices use admin user + SSH key (no password auth).
# ProxyJump through gateway1 using key; no sshpass on infra path.
[infra_net:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -i {{ infra_ssh_private_key_path }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p {{ infra_admin_user }}@173.168.0.10"'

[all:vars]
ansible_user={{ infra_admin_user }}
ansible_ssh_private_key_file={{ infra_ssh_private_key_path }}

# Client VMs: intentionally weak credentials (attack surface for lab demos).
[clients:vars]
ansible_user={{ client_user }}
ansible_password={{ client_password }}
ansible_ssh_common_args='-o ProxyCommand="ssh -i {{ infra_ssh_private_key_path }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p {{ infra_admin_user }}@173.168.0.10"'
